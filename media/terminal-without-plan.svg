<svg xmlns="http://www.w3.org/2000/svg" width="560" height="176" aria-labelledby="t1" role="img" viewBox="0 0 560 176"><title id="t1">Terminal after /clear without planning files: the agent has lost the task and asks the user to restate it</title><rect width="559" height="175" x=".5" y=".5" fill="#0d1117" stroke="#30363d" rx="10"/><path fill="#161b22" d="M0.5 10.5a10 10 0 0 1 10-10h539a10 10 0 0 1 10 10V40H0.5z"/><line x1=".5" x2="559.5" y1="40" y2="40" stroke="#30363d"/><circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/><text x="290" y="25" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">agent · after /clear</text><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5"><text x="24" y="76"><tspan fill="#58a6ff">❯</tspan><tspan fill="#c9d1d9" dx="8">continue</tspan></text><text x="24" y="120" fill="#8b949e">I don’t have context from an earlier session.</text><text x="24" y="142" fill="#8b949e">Can you describe the task and where you left off?</text></g></svg>